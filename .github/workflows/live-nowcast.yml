# Serverless operation of the early-warning system (free for public repositories):
# every 30 minutes the latest reports are fetched, the calibrated forecasts are logged and
# verified, and the dashboard is republished to GitHub Pages. The prediction database lives on
# the single-commit branch "live-data" (force-pushed, so the repository history does not grow).
#
# Timing: aviationweather.gov receives the routine LTAC METARs of HH:20 and HH:50 UTC 8-17 min
# after their observation time, so runs start at HH:10 and HH:40. An external scheduler starts
# them on time through the workflow_dispatch API (see README); GitHub's own schedule, which is
# often late, is the fallback in live-nowcast-fallback.yml. This file has no schedule, so GitHub's
# rule that turns off scheduled workflows after 60 days without repository activity does not
# apply to it. Issue times that no run covered are computed by the next run (app/live_log.py).
name: Live nowcast

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-nowcast
  cancel-in-progress: false

jobs:
  nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore the live prediction database
        run: |
          mkdir -p live
          # exit code 2 = the branch does not exist yet (first run); any other failure must stop
          # the job, otherwise the stale seed database would be force-pushed over the live record
          status=0
          git ls-remote --exit-code --heads origin live-data > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --depth 1 origin live-data
            git show FETCH_HEAD:live_predictions.sqlite > live/live_predictions.sqlite
            # Unix time of the last saved record, used when this run cannot save its own
            echo "LAST_SAVED=$(git log -1 --format=%ct FETCH_HEAD)" >> "$GITHUB_ENV"
          elif [ "$status" -eq 2 ]; then
            cp logs/live_predictions.sqlite live/live_predictions.sqlite
          else
            echo "cannot read the live-data branch (git exit code $status)" >&2
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-live.txt

      - name: Install the minimal runtime
        run: pip install -r app/requirements-live.txt

      - name: Forecast, log, verify and build the static dashboard
        run: python app/publish_static.py --db live/live_predictions.sqlite --out site

      - name: Save the database to the live-data branch
        id: save
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp site/api/verification live/verification.json
          cd live
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_predictions.sqlite verification.json
          git commit -q -m "Live nowcast log $(date -u +%Y-%m-%dT%H:%MZ)"
          # GitHub occasionally rejects a push for a while: a server error, "fatal error in
          # commit_refs_rules", or a 403 for the Actions token although it has contents: write
          saved=false
          for attempt in 1 2 3 4; do
            if git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data; then
              saved=true
              break
            elif [ "$attempt" -lt 4 ]; then
              echo "push attempt $attempt failed; retrying in $((attempt * 15)) s" >&2
              sleep $((attempt * 15))
            fi
          done
          echo "saved=$saved" >> "$GITHUB_OUTPUT"
          if [ "$saved" = false ]; then
            echo "push to live-data failed 4 times" >&2
            # A single failure repairs itself: the next run restores the last saved record and
            # recomputes the missed issue times (catch-up, up to ~68 h back), and the site waits
            # for that run. So the run fails, and GitHub sends its failure e-mail, only when no
            # record exists or none has been saved for over 2 hours (about 4 failed runs in a
            # row); otherwise it ends with a warning on the run page.
            if [ -z "${LAST_SAVED:-}" ]; then
              echo "no saved record exists" >&2
              exit 1
            fi
            unsaved_min=$(( ($(date +%s) - LAST_SAVED) / 60 ))
            if [ "$unsaved_min" -gt 120 ]; then
              echo "the record has not been saved for $unsaved_min min" >&2
              exit 1
            fi
            echo "::warning::Record not saved this time (last saved $unsaved_min min ago); the next run saves it and recomputes the missed issue times."
          fi

      # The site is published only together with a saved record
      - if: steps.save.outputs.saved == 'true'
        uses: actions/configure-pages@v6
      - if: steps.save.outputs.saved == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # Right after the upload the artifact service sometimes does not list the artifact yet
      # ("No artifacts named github-pages were found"); in that case wait and deploy once more.
      - id: deploy
        if: steps.save.outputs.saved == 'true'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying the deployment
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
