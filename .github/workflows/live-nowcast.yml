# Serverless operation of the early-warning system (free for public repositories):
# every 30 minutes, shortly after the routine LTAC METARs (HH:20/HH:50 UTC), the latest
# reports are fetched, the calibrated forecasts are logged and verified, and the dashboard
# is republished to GitHub Pages. The prediction database lives on the single-commit
# branch "live-data" (force-pushed, so the repository history does not grow).
name: Live nowcast

on:
  schedule:
    - cron: "27,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-nowcast
  cancel-in-progress: false

jobs:
  nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore the live prediction database
        run: |
          mkdir -p live
          if git fetch --depth 1 origin live-data 2>/dev/null; then
            git show FETCH_HEAD:live_predictions.sqlite > live/live_predictions.sqlite
          else
            cp logs/live_predictions.sqlite live/live_predictions.sqlite
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-live.txt

      - name: Install the minimal runtime
        run: pip install -r app/requirements-live.txt

      - name: Forecast, log, verify and build the static dashboard
        run: python app/publish_static.py --db live/live_predictions.sqlite --out site

      - name: Save the database to the live-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp site/api/verification live/verification.json
          cd live
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_predictions.sqlite verification.json
          git commit -q -m "Live nowcast log $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
